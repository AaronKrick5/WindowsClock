# Checks for all components (crates) that the program uses.
# Run by the automated build. See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[advisories]
# Fail the build if a component has a known security advisory.
yanked = "deny"

[licenses]
# Only OSI-approved licenses that are compatible with the MIT license of this project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
