[package]
name = "windowsclock"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A clock overlay for Windows 11 that shows only on the monitors you select."
repository = "https://github.com/AaronKrick5/WindowsClock"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
